name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: node --check xpower-flow-card.js
      - name: Unit tests
        run: npm test
